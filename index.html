<meta name="description" content="Miel 100% natural de Apigold, proyecto apícola sostenible de Remedios, Antioquia. Pide por WhatsApp.">

<style>
:root{
  --miel:#E8961E; --miel-osc:#B8680A; --propoleo:#6B3410; --cera:#FBEFC4;
  --cera-2:#F6E2A0; --bosque:#1F4A2C; --tinta:#2A1A0C; --blanco:#FFFDF6;
  --serif:"Young Serif", Georgia, "Times New Roman", serif;
  --sans:"Nunito Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--cera);color:var(--tinta);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--bosque);outline-offset:3px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* Barra superior */
.top{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:env(safe-area-inset-top,0px);
  background:rgba(251,239,196,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(107,52,16,.12)}
.top-in{max-width:1100px;margin:0 auto;height:60px;display:flex;align-items:center;gap:12px;padding:0 18px}
.top-in img{width:42px;height:auto}
.top-in strong{font-family:var(--serif);font-weight:400;font-size:1.3rem;color:var(--propoleo)}
.top nav{margin-left:auto;display:flex;gap:18px}
.top nav a{text-decoration:none;font-weight:600;font-size:.95rem;color:var(--propoleo)}
@media(max-width:720px){.top nav{display:none}}

/* Hero */
.hero{position:relative;min-height:100svh;display:grid;align-items:end;color:var(--blanco);overflow:hidden}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 55%;transform:scale(1.06);animation:acerca 2.4s ease-out forwards}
@keyframes acerca{to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(42,26,12,.05) 30%,rgba(42,26,12,.82) 88%)}
.hero-txt{position:relative;z-index:1;max-width:1100px;width:100%;margin:0 auto;padding:0 22px calc(44px + env(safe-area-inset-bottom,0px))}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(3rem,11vw,6.5rem);line-height:.95;margin:0 0 .25em;letter-spacing:-.01em}
.hero p{font-size:clamp(1.05rem,2.6vw,1.3rem);max-width:34ch;margin:0 0 1.4em}
.lugar{display:inline-block;font-weight:600;font-size:.95rem;margin-bottom:1em;padding:.3em .8em;border-radius:99px;background:rgba(31,74,44,.85)}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:.5em;font-family:var(--sans);font-weight:800;font-size:1rem;text-decoration:none;border:0;cursor:pointer;
  padding:.95em 1.5em;border-radius:14px;background:var(--miel);color:var(--tinta)}
.btn:hover{background:#F2A63A}
.btn.claro{background:rgba(255,253,246,.16);color:var(--blanco);border:1.5px solid rgba(255,253,246,.6)}
.btn.verde{background:var(--bosque);color:var(--blanco)}
.btn svg{width:20px;height:20px;flex:none}

/* Secciones */
section{padding:84px 22px}
.in{max-width:1100px;margin:0 auto}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(2rem,5.5vw,3.2rem);line-height:1.05;margin:0 0 .4em;color:var(--propoleo)}
.lead{font-size:1.15rem;max-width:58ch;margin:0 0 2em}

/* Panal: la firma visual */
.panal{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center}
.hex{aspect-ratio:1/1.1547;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--miel);padding:12px}
.hex img{width:100%;height:100%;object-fit:cover;clip-path:inherit}
.datos{display:grid;gap:22px;margin-top:8px}
.dato{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start}
.dato i{width:44px;height:50px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--cera-2);display:grid;place-items:center;font-style:normal;font-size:1.3rem}
.dato h3{margin:0 0 .15em;font-size:1.08rem}
.dato p{margin:0;color:#5a432c}
@media(max-width:820px){.panal{grid-template-columns:1fr}.hex{max-width:420px;margin:0 auto}}

/* Configurador */
.config{background:var(--propoleo);color:var(--blanco)}
.config h2{color:var(--cera)}
.conf{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.vista{position:relative;border-radius:22px;overflow:hidden;background:#3d1d08}
.vista img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:var(--pos,50% 60%);transition:object-position .5s ease}
.vista span{position:absolute;left:14px;bottom:14px;background:var(--miel);color:var(--tinta);font-weight:800;padding:.35em .9em;border-radius:10px}
fieldset{border:0;margin:0 0 22px;padding:0}
legend{font-weight:800;margin-bottom:10px;font-size:1.02rem}
.opc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opc label{cursor:pointer}
.opc input{position:absolute;opacity:0}
.opc span{display:block;text-align:center;padding:14px 8px;border-radius:14px;border:2px solid rgba(251,239,196,.3);font-weight:600;line-height:1.25}
.opc span small{display:block;font-weight:400;opacity:.8;font-size:.82rem}
.opc input:checked+span{border-color:var(--miel);background:rgba(232,150,30,.18)}
.opc input:focus-visible+span{outline:3px solid var(--cera);outline-offset:2px}
.cant{display:flex;align-items:center;gap:14px}
.cant button{width:46px;height:46px;border-radius:12px;border:2px solid rgba(251,239,196,.4);background:transparent;color:var(--blanco);font-size:1.4rem;cursor:pointer}
.cant output{font-family:var(--serif);font-size:1.8rem;min-width:2ch;text-align:center}
.campo{display:grid;gap:6px;margin-bottom:14px}
.campo input{font:inherit;padding:.8em 1em;border-radius:12px;border:2px solid rgba(251,239,196,.3);background:rgba(255,253,246,.06);color:var(--blanco)}
.campo input::placeholder{color:rgba(251,239,196,.55)}
.nota{font-size:.92rem;opacity:.85;margin:.8em 0 0}
@media(max-width:820px){.conf{grid-template-columns:1fr}}

/* Videos */
.videos{background:var(--cera-2)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
.vcard{background:var(--blanco);border-radius:20px;overflow:hidden;border:1px solid rgba(107,52,16,.15)}
.vcard iframe{width:100%;height:620px;border:0;display:block;background:#fff}
.vcard a{display:block;padding:14px 18px;font-weight:700;color:var(--propoleo);text-decoration:none;border-top:1px solid rgba(107,52,16,.12)}

/* Foto completa */
.foto{padding:0}
.foto figure{margin:0;position:relative}
.foto img{width:100%;max-height:80vh;object-fit:cover}
.foto figcaption{position:absolute;right:16px;bottom:14px;color:var(--blanco);font-size:.9rem;text-shadow:0 1px 6px rgba(0,0,0,.6)}

/* Contacto */
.contacto .lista{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.contacto a.item{display:block;text-decoration:none;padding:20px;border-radius:18px;background:var(--blanco);border:1px solid rgba(107,52,16,.15)}
.item b{display:block;font-size:.9rem;color:var(--miel-osc);margin-bottom:4px}
.item span{font-size:1.1rem;font-weight:700;word-break:break-word}

footer{background:var(--tinta);color:var(--cera);padding:34px 22px calc(100px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.92rem}
footer a{color:var(--miel)}

/* Botón flotante */
.flota{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;width:60px;height:60px;border-radius:50%;
  background:#25D366;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.flota svg{width:32px;height:32px;fill:#fff}
</style>
</head>
